<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Sector Not Found | NexusX Esports India</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #060709;
        color: #f8fafc;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        background: #0d0f14;
        border: 1px solid rgba(203, 213, 225, 0.16);
        padding: 36px 28px;
        position: relative;
      }
      .bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #e11d2e;
      }
      .code {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e11d2e;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #94a3b8;
        line-height: 1.6;
        font-size: 15px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.btn-primary {
        display: inline-block;
        padding: 12px 22px;
        background: #e11d2e;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      a.btn-secondary {
        display: inline-block;
        padding: 12px 22px;
        border: 1px solid rgba(203, 213, 225, 0.25);
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="bar"></div>
      <div class="code">ERROR 404 // ROUTE OFFLINE</div>
      <h1>Drop Zone Not Found</h1>
      <p>
        The page or match briefing you requested does not exist or has moved. Return to the
        NexusX Esports India command hub to browse active BGMI tournaments and standings.
      </p>
      <div class="actions">
        <a id="home-link" class="btn-primary" href="./">Return to Home</a>
        <a id="tournaments-link" class="btn-secondary" href="./#/tournaments">View Tournaments</a>
      </div>
    </main>
    <script>
      (function () {
        // Resolve app root even when user hits a deeply nested invalid path on GitHub Pages project sites
        var pathParts = window.location.pathname.split('/').filter(Boolean);
        var base = pathParts.length > 0 && window.location.hostname.endsWith('github.io')
          ? '/' + encodeURIComponent(pathParts[0]) + '/'
          : '/';
        document.getElementById('home-link').setAttribute('href', base);
        document.getElementById('tournaments-link').setAttribute('href', base + '#/tournaments');
      })();
    </script>
  </body>
</html>
