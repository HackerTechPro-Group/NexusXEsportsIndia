name: Deploy NexusX Esports India to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate static JSON data files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const files = ["site-config.json", "tournaments.json", "leaderboard.json", "schedule.json", "results.json", "news.json"];
            for (const f of files) {
              const p = path.join("public", "data", f);
              const parsed = JSON.parse(fs.readFileSync(p, "utf8"));
              if (!parsed || typeof parsed !== "object") throw new Error("Invalid JSON root in " + p);
            }
            const t = JSON.parse(fs.readFileSync("public/data/tournaments.json", "utf8"));
            if (!Array.isArray(t.tournaments)) throw new Error("tournaments.json missing tournaments array");
            const seen = new Set();
            for (const item of t.tournaments) {
              if (!item.id || seen.has(item.id)) throw new Error("Duplicate or empty tournament ID: " + item.id);
              seen.add(item.id);
            }
            console.log("All public/data/*.json files validated successfully.");
          '

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:worker

      - name: Build static site
        env:
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_ADMIN_PATH: ${{ vars.VITE_ADMIN_PATH }}
          VITE_ADMIN_PATH_HASH: ${{ vars.VITE_ADMIN_PATH_HASH }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
